<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopCraft - Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
    h2 { margin-bottom: 1rem; text-align: center; color: #1f2937; }
    input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 0.7rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .toggle { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    .toggle a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>

  <div class="card" id="loginCard">
    <h2>Login to ShopCraft</h2>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button onclick="handleLogin()">Login</button>
    <div class="toggle">Don't have an account? <a href="#" onclick="toggleView()">Register</a></div>
  </div>

  <div class="card" id="registerCard" style="display:none;">
    <h2>Register Account</h2>
    <input type="text" id="regName" placeholder="Full Name" required>
    <input type="email" id="regEmail" placeholder="Email" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <button onclick="handleRegister()">Register</button>
    <div class="toggle">Already registered? <a href="#" onclick="toggleView()">Login</a></div>
  </div>

  <script>
    function toggleView() {
      const l = document.getElementById('loginCard');
      const r = document.getElementById('registerCard');
      l.style.display = l.style.display === 'none' ? 'block' : 'none';
      r.style.display = r.style.display === 'none' ? 'block' : 'none';
    }

    async function handleRegister() {
      const fullName = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ fullName, email, password })
      });
      const data = await res.json();
      alert(data.message);
      if(res.ok) toggleView();
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(res.ok) {
        localStorage.setItem('user', JSON.stringify(data));
        window.location.href = '/dashboard.html';
      } else {
        alert(data.message);
      }
    }
  </script>
</body>
</html>
